name: Update Types

on:
    schedule:
        - cron: "0 * * * *"
    workflow_dispatch:
        inputs:
            force:
                description: "Skip hash check and force generation"
                type: boolean
                default: false

permissions:
    actions: write
    contents: write

jobs:
    update_types:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: 1.1.34

            - name: Install dependencies
              run: bun install

            - id: cicd
              name: Get hash from schema
              run: bun cicd ${{ github.event.inputs.force == 'true' && '--force' || '' }}

            - name: Generate types
              if: ${{ steps.cicd.outputs.changed == 'true' }}
              run: bun generate

            - name: Prepare to JSR publish
              if: ${{ steps.cicd.outputs.changed == 'true' }}
              run: bun jsr

            - name: Commit and Push changes
              if: ${{ steps.cicd.outputs.changed == 'true' }}
              uses: EndBug/add-and-commit@v9
              with:
                  message: "release v${{ steps.cicd.outputs.version }}"

            - name: Dispatch trusted release workflow
              if: ${{ steps.cicd.outputs.changed == 'true' }}
              run: gh workflow run publish.yml --ref "$GITHUB_REF_NAME"
              env:
                  GH_TOKEN: ${{ github.token }}
